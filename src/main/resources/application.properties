spring.datasource.url=jdbc:h2:mem:demo2db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ???? ?????????? (Demo2Application.main() ?????? ?????????????? ??? ??????????)
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT ?????????
jwt.secret=01234567890123456789012345678901
jwt.expirationMs=3600000

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# ????????? ??????? ??? ??????
app.open-browser=true

# ── Email / SMTP ─────────────────────────────────────────────────────────────
# To activate real email sending:
#   1. Set app.mail.enabled=true
#   2. Replace username/password with your Gmail + App Password
#   3. Set app.notification.strategy=email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false

# Notification strategy: 'console' (default, logs to stdout) or 'email' (sends via SMTP)
app.notification.strategy=console
