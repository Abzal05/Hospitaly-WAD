<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Ошибка</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="container">

    <header th:replace="~{fragments/header :: navbar}"></header>

    <div style="max-width:520px;margin:4rem auto;text-align:center">
        <div style="font-size:5rem;margin-bottom:1rem"
             th:text="${status == 404} ? '🔍' : (${status == 403} ? '🔒' : '💥')"></div>

        <h1 style="font-size:4rem;margin:0;color:var(--primary)" th:text="${status ?: 500}"></h1>

        <p style="font-size:1.2rem;color:var(--muted);margin:1rem 0"
           th:text="${message ?: 'Что-то пошло не так'}"></p>

        <div style="margin-top:2rem;display:flex;gap:0.75rem;justify-content:center">
            <a th:href="@{/}" class="btn">На главную</a>
            <a href="javascript:history.back()" class="btn secondary">Назад</a>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
