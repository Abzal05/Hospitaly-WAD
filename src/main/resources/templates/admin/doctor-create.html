<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Добавить врача</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="container">

    <header th:replace="~{fragments/header :: navbar}"></header>

    <div class="admin-layout">
        <nav th:replace="~{fragments/sidebar :: adminSidebar}" th:with="activePage='doctors'"></nav>

        <main class="admin-main">
            <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem">
                <a th:href="@{/admin/doctors}" style="color:var(--muted);text-decoration:none">← Назад</a>
                <h2 style="margin:0">Добавить врача</h2>
            </div>

            <div class="card" style="max-width:580px">
                <form th:action="@{/admin/doctors/create}" th:object="${doctorDto}" method="post"
                      style="display:flex;flex-direction:column;gap:1rem">

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                        <div class="form-field">
                            <label>Имя *</label>
                            <input type="text" th:field="*{firstName}" class="input" required/>
                            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></span>
                        </div>
                        <div class="form-field">
                            <label>Фамилия *</label>
                            <input type="text" th:field="*{lastName}" class="input" required/>
                            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></span>
                        </div>
                    </div>

                    <div class="form-field">
                        <label>Специальность *</label>
                        <input type="text" th:field="*{specialty}" class="input" required/>
                        <span th:if="${#fields.hasErrors('specialty')}" th:errors="*{specialty}" class="field-error"></span>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                        <div class="form-field">
                            <label>Email</label>
                            <input type="email" th:field="*{email}" class="input"/>
                            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
                        </div>
                        <div class="form-field">
                            <label>Телефон</label>
                            <input type="text" th:field="*{phone}" class="input"/>
                        </div>
                    </div>

                    <div class="form-field">
                        <label>Больница</label>
                        <select th:field="*{hospitalId}" class="input">
                            <option value="">— Не выбрано —</option>
                            <option th:each="h : ${hospitals}" th:value="${h.id}" th:text="${h.name}"></option>
                        </select>
                    </div>

                    <div style="display:flex;gap:0.75rem">
                        <button type="submit" class="btn">Добавить</button>
                        <a th:href="@{/admin/doctors}" class="btn secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
