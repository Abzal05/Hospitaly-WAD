<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Администрирование - Пациенты</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="container">

    <header th:replace="~{fragments/header :: navbar}"></header>

    <div class="admin-layout">
        <nav th:replace="~{fragments/sidebar :: adminSidebar}" th:with="activePage='patients'"></nav>

        <main class="admin-main">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
                <h2 style="margin:0">🏥 Пациенты</h2>
                <a th:href="@{/admin/patients/create}" class="btn">+ Добавить</a>
            </div>

            <div th:if="${success}" class="alert-success" th:text="${success}"></div>

            <div class="card" style="padding:0;overflow:hidden">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Телефон</th>
                        <th>Пол</th>
                        <th>Дата рождения</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${patients}">
                        <td th:text="${p.id}"></td>
                        <td style="font-weight:600" th:text="${p.firstName + ' ' + p.lastName}"></td>
                        <td th:text="${p.email}"></td>
                        <td th:text="${p.phone}"></td>
                        <td th:text="${p.gender}"></td>
                        <td th:text="${p.dob != null ? #temporals.format(p.dob,'dd.MM.yyyy') : '—'}"></td>
                        <td>
                            <a th:href="@{/admin/patients/{id}/edit(id=${p.id})}" class="btn btn-sm">Изменить</a>
                            <form th:action="@{/admin/patients/{id}/delete(id=${p.id})}" method="post"
                                  style="display:inline" onsubmit="return confirm('Удалить пациента?')">
                                <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="7" class="empty">Пациенты не найдены</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
