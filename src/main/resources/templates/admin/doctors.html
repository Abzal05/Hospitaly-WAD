<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Администрирование - Врачи</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="container">

    <header th:replace="~{fragments/header :: navbar}"></header>

    <div class="admin-layout">
        <nav th:replace="~{fragments/sidebar :: adminSidebar}" th:with="activePage='doctors'"></nav>

        <main class="admin-main">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
                <h2 style="margin:0">👨‍⚕️ Врачи</h2>
                <a th:href="@{/admin/doctors/create}" class="btn">+ Добавить</a>
            </div>

            <div th:if="${success}" class="alert-success" th:text="${success}"></div>

            <div class="card" style="padding:0;overflow:hidden">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Специальность</th>
                        <th>Email</th>
                        <th>Телефон</th>
                        <th>Больница</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${doctors}">
                        <td th:text="${d.id}"></td>
                        <td style="font-weight:600"
                            th:text="${d.firstName + ' ' + d.lastName}"></td>
                        <td><span class="badge" th:text="${d.specialty}"></span></td>
                        <td th:text="${d.email}"></td>
                        <td th:text="${d.phone}"></td>
                        <td th:text="${d.hospital != null ? d.hospital.name : '—'}"></td>
                        <td>
                            <a th:href="@{/admin/doctors/{id}/edit(id=${d.id})}" class="btn btn-sm">Изменить</a>
                            <form th:action="@{/admin/doctors/{id}/delete(id=${d.id})}" method="post"
                                  style="display:inline" onsubmit="return confirm('Удалить врача?')">
                                <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(doctors)}">
                        <td colspan="7" class="empty">Врачи не найдены</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
